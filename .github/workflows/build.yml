name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Publishes site/index.html (the overlay LIVE Studio loads) to GitHub Pages
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  build:
    runs-on: windows-latest
    permissions:
      contents: write  # publishes the GitHub Release the app updates from
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Write overlay address into the app
        shell: bash
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "https://${owner}.github.io/${{ github.event.repository.name }}/" > overlay_url.txt
          cat overlay_url.txt

      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name RoomIDOverlay
          --add-data "overlay.html;." --add-data "control.html;." --add-data "example_room.png;." --add-data "example_roomid.png;."
          --add-data "overlay_url.txt;." --add-data "version.txt;."
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime --collect-all windows_capture
          --hidden-import pygrabber.dshow_graph
          app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: RoomIDOverlay-Setup
          path: Output/RoomIDOverlay-Setup.exe

      # Installed apps offer the update as soon as this publishes, so it only happens on a new version.txt
      - name: Publish release if version.txt is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < version.txt)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh release create "$tag" Output/RoomIDOverlay-Setup.exe --title "$tag" --generate-notes --target "$GITHUB_SHA"
          fi
