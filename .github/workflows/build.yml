name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name RoomIDOverlay
          --add-data "overlay.html;." --add-data "control.html;." --add-data "example_room.png;." --add-data "example_roomid.png;."
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime
          --hidden-import pygrabber.dshow_graph
          app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: RoomIDOverlay-Setup
          path: Output/RoomIDOverlay-Setup.exe
