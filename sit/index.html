<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Room Overlay</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; padding: 10px; }
  #box {
    display: inline-grid; grid-template-columns: auto auto; column-gap: 1.6em; row-gap: .05em;
    padding: .25em .6em; border-radius: 10px;
    background: rgba(20, 20, 24, 0.82);
    color: #fff; font-size: 64px; font-weight: 800; line-height: 1.15;
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    opacity: 0; transform: scale(.96);
    transition: opacity .35s ease, transform .35s ease;
  }
  #box.show { opacity: 1; transform: none; }
  #box.flash { animation: flash 1.2s ease; }
  @keyframes flash { 30% { box-shadow: 0 0 0 4px #fff, 0 0 30px rgba(255,255,255,.6); } }
  .pw.hidden { display: none; }
  .val { text-align: right; }
  #msg { color: #fff; font-size: 18px; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div id="box">
  <span>ID</span><span class="val" id="rid">-</span>
  <span class="pw">PW</span><span class="val pw" id="pw">-</span>
</div>
<div id="msg">This link is missing its code. Copy it again from the Room ID Overlay app.</div>
<script>
  // The Room ID Overlay app on the streamer's PC sends updates through ntfy.sh on a private
  // random channel (the ?t= code in this link). This page shows the latest one.
  const params0 = new URLSearchParams(location.search);
  const RELAY = params0.get("relay") || "https://ntfy.sh/";  // ?relay= is only for testing
  const params = new URLSearchParams(location.search);
  const topic = (params.get("t") || "").replace(/[^A-Za-z0-9_-]/g, "");
  const box = document.getElementById("box");
  let lastKey = null, lastId = null;

  function apply(s) {
    const rid = s.room_id, pw = s.password;
    box.classList.toggle("show", !!(s.visible && rid));
    document.querySelectorAll(".pw").forEach(el => el.classList.toggle("hidden", !pw));
    const key = rid + "|" + pw;
    if (key !== lastKey) {
      document.getElementById("rid").textContent = rid || "-";
      document.getElementById("pw").textContent = pw || "-";
      if (lastKey !== null && rid) {
        box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
      }
      lastKey = key;
    }
  }

  function handle(m) {
    if (!m || m.event !== "message" || m.id === lastId) return;
    lastId = m.id;
    try { apply(JSON.parse(m.message)); } catch (e) {}
  }

  async function latest() {  // the most recent update, e.g. after LIVE Studio (re)loads the page
    try {
      const r = await fetch(RELAY + topic + "/json?poll=1&since=latest", { cache: "no-store" });
      (await r.text()).trim().split("\n").filter(Boolean).forEach(line => {
        try { handle(JSON.parse(line)); } catch (e) {}
      });
    } catch (e) {}
  }

  function listen() {  // live updates; EventSource reconnects by itself if the connection drops
    const es = new EventSource(RELAY + topic + "/sse");
    es.onopen = latest;  // catch anything missed while disconnected
    es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };
  }

  if (!topic) {
    document.getElementById("msg").style.display = "inline-block";
  } else {
    // tell the app "LIVE Studio has loaded me" so its setup can show a green tick
    fetch(RELAY + topic + "-seen", { method: "POST", body: "seen" }).catch(() => {});
    latest().then(listen);
  }
</script>
</body>
</html>
